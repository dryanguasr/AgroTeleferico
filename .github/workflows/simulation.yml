name: Piloto Gazebo
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-supervisor:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Contratos del supervisor Windows
        shell: pwsh
        run: ./tests/test_windows_supervisor.ps1 -Output results/windows_supervisor_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-windows-supervisor
          path: results/
  simulation:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [unit-install, lifecycle-current, demand-native, historical-convergence]
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-jazzy-launch-ros ros-jazzy-ros-gz ros-jazzy-gz-sim-vendor ros-jazzy-gz-plugin-vendor libeigen3-dev python3-colcon-common-extensions python3-yaml python3-numpy python3-matplotlib python3-scipy python3-pil ffmpeg
      - name: Compilación
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DBUILD_TESTING=ON
      - name: Unitarios e instalación aislada
        if: matrix.suite == 'unit-install'
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
          python3 tests/test_installation.py
          python3 scripts/run_loop_suite.py --config config/legacy/loop_13_supports.yaml --binary build/agro_teleferico/agro_loop_cli --output results/loop_13_cli_ci
      - name: Ciclo de vida del piloto vigente
        if: matrix.suite == 'lifecycle-current'
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 tests/test_loop_native.py --scenario ballasted --output results/current_lifecycle_ci
      - name: Réplica nativa corta de demanda
        if: matrix.suite == 'demand-native'
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 "$(ros2 pkg prefix agro_teleferico)/lib/agro_teleferico/run_demand_smoke.py" --linux-host --output results/demand_smoke_ci
      - name: Regresiones históricas y convergencia
        if: matrix.suite == 'historical-convergence'
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 tests/test_ros_integration.py
          python3 tests/test_saturation.py
          python3 scripts/run_suite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-${{ matrix.suite }}
          path: |
            results/
            log/
            build/agro_teleferico/Testing/
