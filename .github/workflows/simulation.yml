name: Piloto Gazebo
on: [push, pull_request, workflow_dispatch]
jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-jazzy-launch-ros ros-jazzy-ros-gz ros-jazzy-gz-sim-vendor ros-jazzy-gz-plugin-vendor libeigen3-dev python3-colcon-common-extensions python3-yaml python3-numpy python3-matplotlib python3-scipy
      - name: Compilación y pruebas físicas
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DBUILD_TESTING=ON
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Integración ROS y saturación
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 tests/test_ros_integration.py
          python3 tests/test_saturation.py
      - name: Simulaciones y convergencia temporal
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/run_suite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-gazebo
          path: |
            results/
            log/
